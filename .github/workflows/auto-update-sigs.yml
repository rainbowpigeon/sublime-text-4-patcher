name: Auto-update patch signatures

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional specific build number to test"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      new_build_found: ${{ steps.detect_step.outputs.new_build_found }}
      new_build_dev: ${{ steps.detect_step.outputs.new_build_dev }}
      new_build_url_dev: ${{ steps.detect_step.outputs.new_build_url_dev }}
      new_build_stable: ${{ steps.detect_step.outputs.new_build_stable }}
      new_build_url_stable: ${{ steps.detect_step.outputs.new_build_stable_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Detect new builds
        id: detect_step
        run: |
          if [ -n "${BUILD_NUM}" ]; then
            echo "Using manually specified build: ${BUILD_NUM}"
            echo "new_build_found=true" >> $GITHUB_OUTPUT
            echo "new_build_dev=${BUILD_NUM}" >> $GITHUB_OUTPUT
            echo "new_build_url_dev=https://download.sublimetext.com/sublime_text_build_${BUILD_NUM}_x64.zip" >> $GITHUB_OUTPUT
          else
            python scripts/signature_scanner.py detect
          fi
        env:
          BUILD_NUM: ${{ inputs.build_number }}

  test_and_extract:
    needs: detect
    if: needs.detect.outputs.new_build_found == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_result.outputs.has_changes }}
      sig_changes: ${{ steps.check_result.outputs.sig_changes }}
      build: ${{ steps.download.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        id: cache-binaries
        with:
          path: downloads/
          key: builds-${{ needs.detect.outputs.new_build_dev }}-${{ hashFiles('sublime_text_4_patcher.py') }}

      - name: Download new build
        id: download
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          mkdir -p "downloads/build_${BUILD_NUM}"
          curl -fSL -o "downloads/build_${BUILD_NUM}/build.zip" "${BUILD_URL}"
          unzip -o -d "downloads/build_${BUILD_NUM}" "downloads/build_${BUILD_NUM}/build.zip" sublime_text.exe
          rm "downloads/build_${BUILD_NUM}/build.zip"
          echo "build=${BUILD_NUM}" >> $GITHUB_OUTPUT
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}
          BUILD_URL: ${{ needs.detect.outputs.new_build_url_dev }}

      - name: Download reference build
        id: download-ref
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: |
          REF_BUILD=$(python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('p', 'sublime_text_4_patcher.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print(max(m.PatchDB.CHANNELS['dev']))
          ")
          mkdir -p "downloads/ref_${REF_BUILD}"
          curl -fSL -o "downloads/ref_${REF_BUILD}/build.zip" "https://download.sublimetext.com/sublime_text_build_${REF_BUILD}_x64.zip"
          unzip -o -d "downloads/ref_${REF_BUILD}" "downloads/ref_${REF_BUILD}/build.zip" sublime_text.exe
          rm "downloads/ref_${REF_BUILD}/build.zip"
          echo "${REF_BUILD}" > downloads/ref_build.txt
          echo "Reference build: ${REF_BUILD}"

      - name: Red phase - test existing signatures
        id: red_test
        run: |
          python scripts/signature_scanner.py test \
            --input "downloads/build_${BUILD_NUM}/sublime_text.exe" \
            --output scan_result.json
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}
        continue-on-error: true

      - name: Check if all signatures passed
        id: check_result
        run: |
          BUILD_NUM="${BUILD_NUM}"
          if python3 -c "import json; d=json.load(open('scan_result.json')); exit(0 if d.get('all_passed') else 1)"; then
            echo "All signatures matched. Checking if build is in CHANNELS..."
            # Even if signatures pass, the build might not be in CHANNELS
            IN_CHANNELS=$(python3 -c "
            import importlib.util
            spec = importlib.util.spec_from_file_location('p', 'sublime_text_4_patcher.py')
            m = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(m)
            v = int('${BUILD_NUM}')
            print('yes' if v in m.PatchDB.CHANNELS.get('dev',[]) or v in m.PatchDB.CHANNELS.get('stable',[]) else 'no')
            ")
            if [ "$IN_CHANNELS" = "no" ]; then
              echo "Build ${BUILD_NUM} not in CHANNELS. Need to add it."
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "sig_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Build already in CHANNELS. No changes needed."
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "sig_changes=false" >> $GITHUB_OUTPUT
            fi
          else
            FAILED=$(python3 -c "import json; d=json.load(open('scan_result.json')); print(len([p for p in d.get('patches',[]) if p['status']=='fail']))")
            echo "${FAILED} signatures failed. Extracting new signatures..."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "sig_changes=true" >> $GITHUB_OUTPUT
          fi
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}

      - name: Extract new signatures
        if: steps.check_result.outputs.sig_changes == 'true'
        run: |
          REF_BUILD=$(cat downloads/ref_build.txt)
          python scripts/signature_scanner.py extract \
            --input "downloads/build_${BUILD_NUM}/sublime_text.exe" \
            --old-input "downloads/ref_${REF_BUILD}/sublime_text.exe" \
            --result scan_result.json \
            --output patch_diff.json
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}
        continue-on-error: true

      - name: Apply diff to source
        if: steps.check_result.outputs.sig_changes == 'true'
        run: |
          python scripts/signature_scanner.py apply \
            --diff patch_diff.json \
            --target sublime_text_4_patcher.py

      - name: Add build to CHANNELS (no sig changes needed)
        if: steps.check_result.outputs.sig_changes == 'false'
        run: |
          python scripts/signature_scanner.py apply \
            --diff <(python3 -c "
          import json
          print(json.dumps({
              'build': int('${BUILD_NUM}'),
              'channel': 'dev' if int('${BUILD_NUM}') % 2 else 'stable',
              'changes': [],
              'version_updates': {
                  'add_to_channels': {'dev': [int('${BUILD_NUM}')] if int('${BUILD_NUM}') % 2 else []}
              }
          }))
          ")
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}

      - name: Verify source still loads
        if: steps.check_result.outputs.has_changes == 'true'
        run: |
          python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('p', 'sublime_text_4_patcher.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print('Source loads OK')
          "

      - name: Green phase - re-test with new signatures
        if: steps.check_result.outputs.sig_changes == 'true'
        run: |
          python scripts/signature_scanner.py test \
            --input "downloads/build_${BUILD_NUM}/sublime_text.exe" \
            --output green_result.json
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}

      - name: Regression test - reference build still works
        if: steps.check_result.outputs.sig_changes == 'true'
        run: |
          REF_BUILD=$(cat downloads/ref_build.txt)
          python scripts/signature_scanner.py test \
            --input "downloads/ref_${REF_BUILD}/sublime_text.exe" \
            --output regression_result.json

      - name: Upload scan results
        if: always() && steps.check_result.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan_result.json
            green_result.json
            regression_result.json
            patch_diff.json

      - name: Update README version
        if: steps.check_result.outputs.has_changes == 'true'
        run: |
          sed -i "s/v4107-[0-9]*/v4107-${BUILD_NUM}/" README.md
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}

      - name: Commit and push
        if: steps.check_result.outputs.has_changes == 'true'
        run: |
          BRANCH="auto/update-build-${BUILD_NUM}"
          git checkout -b "$BRANCH"
          git add sublime_text_4_patcher.py README.md
          git -c user.name="Claude Mythos" -c user.email="noreply@anthropic.com" \
            commit -m "auto: support build ${BUILD_NUM}" || echo "No changes to commit"
          git push origin "$BRANCH" --force
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}

      - name: Create pull request
        if: steps.check_result.outputs.has_changes == 'true'
        env:
          BUILD_NUM: ${{ needs.detect.outputs.new_build_dev }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="auto/update-build-${BUILD_NUM}"
          # Check if PR already exists
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #${EXISTING}"
            exit 0
          fi
          gh pr create \
            --title "auto: support build ${BUILD_NUM}" \
            --body "## Summary
          - Auto-generated patch signature update for Sublime Text build ${BUILD_NUM}
          - Signatures extracted via binary block-matching

          ## Test plan
          - [ ] Red phase: existing signatures tested against build ${BUILD_NUM}
          - [ ] Green phase: new signatures verified against build ${BUILD_NUM}
          - [ ] Regression: signatures verified against reference build

          ## Changes
          - Updated patch signatures
          - Added build to CHANNELS
          - Updated README version range" \
            --head "$BRANCH" \
            --base main
